[]  # Apply to all untagged images
cyls = 40
heads = 2
rpm = 300
mode = mfm

# Head 0, all cylinders
tracks = 0-39.0
  secs = 9
  bps = 512
  interleave = 1
  id = 1      # Sector IDs 1..9

# Head 1, all cylinders
tracks = 0-39.1
  secs = 9
  bps = 512
  interleave = 1
  hskew = 9   # Offset to continue sector numbering from head 0
  id = 10     # Sector IDs 10..18