## DRIVE INTERFACE
interface = ibmpc
host = pc-dos
pin02 = dens
pin34 = chg
write-protect = no
max-cyl = 40
side-select-glitch-filter = 10
track-change = realtime
write-drain = realtime
index-suppression = no
head-settle-ms = 15
motor-delay = 500
chgrst = step

## STARTUP
ejected-on-startup = no
image-on-startup = init
display-probe-ms = 3000

## IMAGE NAVIGATION
autoselect-file-secs = 2
autoselect-folder-secs = 2
folder-sort = always
sort-priority = folders
nav-mode = indexed
nav-loop = yes
twobutton-action = eject
indexed-prefix = "DSKA"

## MISCELLANEOUS
extend-image = yes
